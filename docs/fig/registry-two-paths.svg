<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="292" fill="#ffffff"/>

<rect x="40" y="40" width="290" height="160" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">类型 —— 查出来是一棵类型树</text>
<text x="60" y="92" font-family="monospace" font-size="11" fill="#185FA5">标记  CXF_TYPE(Particle)</text>
<text x="60" y="114" font-family="monospace" font-size="11" fill="#185FA5">要 clang：展开结构体得靠 AST</text>
<text x="60" y="136" font-family="monospace" font-size="11" fill="#185FA5">产出  sizeof / offsetof 表达式</text>
<text x="60" y="158" font-family="monospace" font-size="11" fill="#185FA5">bundle  值数组</text>
<text x="60" y="180" font-family="monospace" font-size="11" fill="#185FA5">find &#8594; const cxf_type *</text>

<rect x="350" y="40" width="290" height="160" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="370" y="64" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">服务 —— 查出来是一张函数指针表</text>
<text x="370" y="92" font-family="monospace" font-size="11" fill="#854F0B">标记  CXF_SERVICE(math_v1, ...)</text>
<text x="370" y="114" font-family="monospace" font-size="11" fill="#854F0B">不要 clang：值全在宏参数里</text>
<text x="370" y="136" font-family="monospace" font-size="11" fill="#854F0B">产出  只 extern 引用那个常量</text>
<text x="370" y="158" font-family="monospace" font-size="11" fill="#854F0B">bundle  指针数组</text>
<text x="370" y="180" font-family="monospace" font-size="11" fill="#854F0B">find &#8594; const void *（转 API 表）</text>

<path d="M185 200 L185 220" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M495 200 L495 220" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="224" width="600" height="48" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2C2C2A">两套都走同一条注册期：装配期登记 &#8594; init 里固化 &#8594; 调用期零查找</text>
</svg>
