<svg viewBox="0 0 680 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>cxf Agent 运行时架构</title>
  <desc>每 rank 跑 cxf 引擎+handlers+本地能力注册表；跨 rank 由调度器/能力注册表协调，经小消息传输层分发 WorkItem</desc>
  <rect x="180" y="20" width="320" height="40" rx="8" fill="#EAF3DE" stroke="#639922"/>
  <text x="340" y="45" font-family="monospace" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle">调度器 / 能力注册表（跨 rank）</text>
  <rect x="40" y="90" width="260" height="170" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="170" y="112" font-family="monospace" font-size="13" font-weight="500" fill="#501313" text-anchor="middle">Phone (rank A)</text>
  <rect x="60" y="124" width="220" height="28" rx="4" fill="#ffffff" stroke="#A32D2D"/>
  <text x="170" y="143" font-family="monospace" font-size="10" fill="#501313" text-anchor="middle">cxf 引擎: tick/phase + SoA</text>
  <rect x="60" y="158" width="220" height="28" rx="4" fill="#ffffff" stroke="#A32D2D"/>
  <text x="170" y="177" font-family="monospace" font-size="10" fill="#501313" text-anchor="middle">handlers: 脚本(12306直购)</text>
  <rect x="60" y="192" width="220" height="28" rx="4" fill="#ffffff" stroke="#A32D2D"/>
  <text x="170" y="211" font-family="monospace" font-size="10" fill="#501313" text-anchor="middle">本地能力注册表 + 小模型</text>
  <rect x="380" y="90" width="260" height="170" rx="8" fill="#FDF0F0" stroke="#A32D2D"/>
  <text x="510" y="112" font-family="monospace" font-size="13" font-weight="500" fill="#501313" text-anchor="middle">PC (rank B)</text>
  <rect x="400" y="124" width="220" height="28" rx="4" fill="#ffffff" stroke="#A32D2D"/>
  <text x="510" y="143" font-family="monospace" font-size="10" fill="#501313" text-anchor="middle">cxf 引擎: tick/phase + SoA</text>
  <rect x="400" y="158" width="220" height="28" rx="4" fill="#ffffff" stroke="#A32D2D"/>
  <text x="510" y="177" font-family="monospace" font-size="10" fill="#501313" text-anchor="middle">handlers: 脚本 + LLM(咸鱼多轮)</text>
  <rect x="400" y="192" width="220" height="28" rx="4" fill="#ffffff" stroke="#A32D2D"/>
  <text x="510" y="211" font-family="monospace" font-size="10" fill="#501313" text-anchor="middle">本地能力注册表 + 大些模型</text>
  <rect x="40" y="280" width="600" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="340" y="303" font-family="monospace" font-size="11" font-weight="500" fill="#633806" text-anchor="middle">传输层: 小消息 ≤1MB（库存 MPI 点对点 / ZeroMQ / 自写 RPC）— 应用层 WorkItem 迁移，非 MPI-world 弹性</text>
  <path d="M340,60 L170,90" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340,60 L510,90" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M170,260 L340,280" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510,260 L340,280" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
